version: '3'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: "/bin/sh -c 'bun run start:dev'"
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/app
    env_file:
      - .env

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: "/bin/sh -c 'bun run start:dev user-service'"
    ports:
      - '3001:3001'
    volumes:
      - .:/usr/src/app
    env_file:
      - .env

  post-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: "/bin/sh -c 'bun run start:dev post-service'"
    ports:
      - '3002:3002'
    volumes:
      - .:/usr/src/app
    env_file:
      - .env

  db:
    container_name: postgres
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialbot
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    volumes:
      - ./tmp/redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    container_name: nest-pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin4
    ports:
      - '5050:80'
    depends_on:
      - db
