name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up SSH agent
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Deploy to EC2
      env:
        HOST: 52.74.240.16  # Replace with your Elastic IP
        USER: ubuntu  # Replace with your EC2 username
        PROJECT_DIR: /home/ec2-user/socialbot  # Replace with your actual project directory
      run: |
        ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
          sudo apt update
          sudo apt install -y docker.io docker-compose
          sudo systemctl start docker
          sudo systemctl enable docker
          if [ ! -d "$PROJECT_DIR" ]; then
            mkdir -p $PROJECT_DIR
            git clone git@github.com:your-repo.git $PROJECT_DIR
          fi
          cd $PROJECT_DIR
          git pull origin main
          sudo docker-compose down
          sudo docker-compose up --build -d
        EOF
