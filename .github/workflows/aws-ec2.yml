name: Build and Deploy to EC2

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

jobs:
  build_and_push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Images
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/socialbot-service:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
    - name: Set up SSH agent
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

    - name: Deploy to EC2
      env:
        HOST: ${{ secrets.EC2_HOST_IP }}  # Replace with your Elastic IP
        USER: ubuntu  # Replace with your EC2 username
        PROJECT_DIR: /home/ubuntu/socialbot
      run: |
        ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
          sudo apt update
          sudo apt install -y docker.io docker-compose
          sudo systemctl start docker
          sudo systemctl enable docker
          if [ ! -d "$PROJECT_DIR" ]; then
            mkdir -p $PROJECT_DIR
          fi
          cd $PROJECT_DIR
          sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/socialbot-service:latest
          echo "version: '3'
          services:
            api:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/socialbot-service:latest
              ports:
                - '3000:3000'
            user-service:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/socialbot-service:latest
              ports:
                - '3001:3001'
            post-service:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/socialbot-service:latest
              ports:
                - '3002:3002'
            db:
              image: postgres
              environment:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
                POSTGRES_DB: socialbot
              volumes:
                - ./pgdata:/var/lib/postgresql/data
              ports:
                - '5432:5432'
            redis:
              image: redis:latest
              ports:
                - '6379:6379'
              volumes:
                - ./tmp/redis_data:/data
            pgadmin:
              image: dpage/pgadmin4
              environment:
                PGADMIN_DEFAULT_EMAIL: admin@admin.com
                PGADMIN_DEFAULT_PASSWORD: pgadmin4
              ports:
                - '5050:80'
              depends_on:
                - db
          ' > docker-compose.yml
          sudo docker-compose down
          sudo docker-compose up --build -d
        EOF
